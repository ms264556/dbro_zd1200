services:
  zd1200:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/zd1200-qemu:10.5.1.0.282
    container_name: ${ZD_CONTAINER_NAME:-zd1200}
    restart: unless-stopped
    init: true

    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun

    # Host netns: the container shares the host's network namespace, so the
    # macvtap for the QEMU guest is created on the host's PHYSICAL interface
    # (eth0) and forwards to the LAN.  A macvtap layered on a Docker macvlan
    # does NOT forward to the parent (verified: the guest's frames never left
    # the container), so the guest must use a top-level macvtap on eth0.
    # NOTE: the container now shares eth0 with the host; the entrypoint does NOT
    # run udhcpc on it (ZD_HOST_NET=1) so the host's IP is never disturbed.
    network_mode: host

    # The QEMU guest attaches through a macvtap created on eth0 (needs
    # NET_ADMIN) and opens the kernel's tap char device, whose major number
    # is host-dependent (hence the wildcard device-cgroup rule).
    #   CAP_MKNOD - the tap char node is not in the container /dev; the entrypoint
    #               mknods it (host-dependent major) so QEMU can open it.
    #   CAP_NET_RAW - the entrypoint's udhcpc needs an AF_PACKET/raw socket to
    #                 request a DHCP lease on the macvlan interface.
    cap_add:
      - NET_ADMIN
      - MKNOD
      - NET_RAW
    device_cgroup_rules:
      - "c *:* rwm"

    environment:
      CPU_MODEL: pentium3
      MEMORY_MB: "2048"
      NETWORK_MODE: macvtap
      ZD_HOST_NET: "1"
      ZD_SIGN_CERT_DIR: /opt/zd1200/signing-cert
      TAP_IF: ${ZD_TAP_IF:-tap-zd}
      GUEST_IP: ${ZD_GUEST_IP:-192.168.50.10}
      # Board data written into the CF image: serial + base MAC (MAC2=MAC1+1).
      # The MAC-derived serial (boarddata-from-mac.sh, used when
      # ZD_BOARDDATA_FROM_MAC=1) is REJECTED by the firmware's support-entitlement
      # check (E_InvalidSerialNumber = "serial number mismatch"), so the banner
      # persists.  This is the known-valid default serial/MAC that passes the check.
      ZD_BOARDDATA_FROM_MAC: "0"
      ZD_SERIAL: ${ZD_SERIAL:-123456000789}
      ZD_MAC1: ${ZD_MAC1:-00:0c:e6:12:00:01}
      # Work around the 2.6.32 tickless-idle spin demonstrated in cpu-study.
      KERNEL_EXTRA: nohz=off
      WEB_WAIT_SECONDS: "600"
      VM_SNAPSHOT: "0"

    volumes:
      - ${ZD_IMAGE_DIR:-./image}:/opt/zd1200/image:ro
      # Signing cert payload consumed by patch-rootfs-signing.sh (the license
      # bypass).  Host path configurable via ZD_SIGN_CERT_HOST (set in .env).
      - ${ZD_SIGN_CERT_HOST:-./image/signing-cert}:/opt/zd1200/signing-cert:ro
      - zd1200-state:/var/lib/zd1200

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

    healthcheck:
      # macvlan isolates the container from its own macvtap guest, so the
      # guest's HTTPS is not reachable from inside the container.  Mark healthy
      # on the guest's READY marker in the serial-console log (written by
      # run-zd1200-web.sh) instead of curling an unreachable static IP.
      test: ["CMD-SHELL", "rg -qF 'System go into READY status.' /tmp/zd1200-web.log 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 8s
      start_period: 10m
      retries: 3

volumes:
  zd1200-state:
