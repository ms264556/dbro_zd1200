services:
  zd1200:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # 1 builds the static dropbear replacement (slow: a cross toolchain plus
        # dropbear and OpenSSH).  Set by install-zd1200-docker.sh --root-ssh-key.
        ZD_ROOT_SSH: ${ZD_ROOT_SSH:-0}
    image: local/zd1200-qemu
    container_name: ${ZD_CONTAINER_NAME:-zd1200}
    # on-failure: a guest poweroff exits 0 and must leave the container stopped;
    # a QEMU crash or entrypoint error still restarts it.  The cost is no
    # auto-start after a host reboot.
    restart: on-failure
    init: true

    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun

    # Host netns: the guest's macvtap must sit directly on the host's physical
    # NIC.  A macvtap stacked on a Docker macvlan does not forward to the parent.
    network_mode: host

    # NET_ADMIN creates the macvtap; MKNOD creates its tap char node, whose major
    # is host-dependent (hence the wildcard cgroup rule); NET_RAW is for udhcpc.
    cap_add:
      - NET_ADMIN
      - MKNOD
      - NET_RAW
    device_cgroup_rules:
      - "c *:* rwm"

    environment:
      # Compose passes only the keys named here: a value that is only in .env
      # reaches nothing.
      #
      # Guest CPU model.  The vendor kernel's clocksource choice depends on the
      # CPUID leaves it sees; n270 resembles the appliance's Atom.
      CPU_MODEL: ${CPU_MODEL:-n270}
      MEMORY_MB: "2048"
      NETWORK_MODE: macvtap
      # The host NIC the guest's macvtap is created on.  Empty = eth0 when the
      # host has one, otherwise the interface that carries the default route.
      ZD_HOST_IF: ${ZD_HOST_IF:-}
      ZD_HOST_NET: "1"
      # auto probes /dev/kvm; tcg forces emulation on a host that has KVM.
      ACCEL: ${ACCEL:-auto}
      # Diagnostics.  VERBOSE boots with `ignore_loglevel` so the kernel log
      # reaches the console log; it is part of the boot area's signature, so
      # reset the state volume when toggling it.  CLOCKSOURCE forces the guest
      # clocksource (empty = the kernel's choice; `acpi_pm` is the alternative).
      ZD_KERNEL_VERBOSE: ${ZD_KERNEL_VERBOSE:-0}
      ZD_KERNEL_CLOCKSOURCE: ${ZD_KERNEL_CLOCKSOURCE:-}
      ZD_SIGN_CERT_DIR: /opt/zd1200/signing-cert
      GUEST_IP: ${ZD_GUEST_IP:-192.168.50.10}
      # Guest identity, written into the disk's board data.  By default MAC1 =
      # ZD_CONTAINER_MAC (generated into .env by the installer), MAC2 = MAC1 + 1
      # and the serial is hashed from MAC1.  ZD_BOARDDATA_FROM_MAC=0 pins the
      # fixed ZD_SERIAL/ZD_MAC1 instead.
      ZD_CONTAINER_MAC: ${ZD_CONTAINER_MAC:-}
      ZD_BOARDDATA_FROM_MAC: ${ZD_BOARDDATA_FROM_MAC:-1}
      ZD_SERIAL: ${ZD_SERIAL:-123456000789}
      ZD_MAC1: ${ZD_MAC1:-00:0c:e6:12:00:01}
      # Seven-character source revision shown on the admin console ("virtual
      # <rev>"); the installer derives it from the checkout.  Empty omits it.
      ZD_VIRTUAL_BUILD_ID: ${ZD_VIRTUAL_BUILD_ID:-}
      # Network Monitor defaults seeded into /writable on the first boot: the
      # collection interval (30-3600 s) and static ping targets as
      # "MAC|IP|NAME" records separated by ";".
      ZD_PING_INTERVAL_SECONDS: ${ZD_PING_INTERVAL_SECONDS:-}
      ZD_PING_CLIENT_TARGETS: ${ZD_PING_CLIENT_TARGETS:-}
      # Public key for root SSH on TCP 2222 (static dropbear).  Whether it is
      # installed is decided by the image payload, not by a runtime variable.
      ZD_ROOT_SSH_AUTHORIZED_KEYS: /opt/zd1200/dropbear-provision/authorized_keys
      # Add an ECDSA host key beside RSA, so modern SSH clients connect.
      ZD_ECDSA_SSH: ${ZD_ECDSA_SSH:-1}
      # Patch the ap-11n-scorpion (R600) mesh bug out of the AP image the guest
      # delivers (install-zd1200-docker.sh --no-r600-repair sets 0).
      ZD_R600_REPAIR: ${ZD_R600_REPAIR:-1}
      WEB_WAIT_SECONDS: "600"
      VM_SNAPSHOT: "0"
      # On stop, ask the guest to reboot (unmount and flush /writable) over
      # ttyS1 before QEMU is torn down, waiting up to ZD_STOP_TIMEOUT seconds.
      ZD_CONTAINER_CONTROL: "1"
      ZD_STOP_TIMEOUT: "240"
      # Stop QEMU after this many consecutive 5 s samples at >= 95% of a core
      # (KVM only).  See "CPU guard" in docs/TROUBLESHOOTING.md.
      ZD_CPU_GUARD: "24"
      # Per-instance names.  With network_mode: host the macvtap and the /tmp
      # sockets are global to the host, so two containers must not share them;
      # install-zd1200-docker.sh writes unique values into .env for a
      # non-default ZD_CONTAINER_NAME.
      ZD_MACVTAP_IF: ${ZD_MACVTAP_IF:-mvt0}
      ZD_CONTROL_SOCK: ${ZD_CONTROL_SOCK:-/tmp/zd1200-control.sock}
      ZD_CONSOLE_SOCK: ${ZD_CONSOLE_SOCK:-/tmp/zd1200-console.sock}
      LOG_FILE: ${LOG_FILE:-/tmp/zd1200-console.log}

    volumes:
      # Vendor artifacts prepared from the firmware (scripts/build/prepare-vendor-image.sh).
      - ./image:/opt/zd1200/image:ro
      # Signing-cert payload for the license patch.
      - ${ZD_SIGN_CERT_HOST:-./image/signing-cert}:/opt/zd1200/signing-cert:ro
      # Public key for the 2222 root listener; may be empty or absent.
      - ${ZD_ROOT_SSH_PROVISION:-./dropbear-provision}:/opt/zd1200/dropbear-provision:ro
      - zd1200-state:/var/lib/zd1200

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Must exceed ZD_STOP_TIMEOUT, or Docker kills the container before the
    # guest has flushed and the entrypoint has removed the macvtap.
    stop_grace_period: 260s

    healthcheck:
      # Asks the guest over the control channel.  A network probe cannot work:
      # the container is isolated from its own macvtap guest.
      test: ["CMD-SHELL", "/opt/zd1200/zd1200-docker-health || exit 1"]
      interval: 30s
      timeout: 8s
      start_period: 10m
      retries: 3

volumes:
  zd1200-state:
